# Engineering baseline with the original unmodified trainer, not paper-scale reproduction.
# Its scheduler initializes LR=0 even when warmup=0; two steps are necessary.
# Paths are explicit for the existing pod. Data must be prepared and checked first.
data:
  train_files: /workspace/praxis/data/original-baseline/train.parquet
  val_files: /workspace/praxis/data/original-baseline/val.parquet
  prompt_key: problem
  answer_key: answer
  image_key: images
  system_prompt: "You are a helpful AI Assistant, designed to provided well-reasoned and detailed responses. You FIRST think about the reasoning process as an internal monologue and then provide the user with the answer. The reasoning process MUST BE enclosed within <think> and </think> tags, and the final answer MUST BE enclosed within <answer> and </answer> tags."
  max_prompt_length: 2048
  max_response_length: 512
  rollout_batch_size: 4
  val_batch_size: 4
  shuffle: true
  seed: 20260910
  max_pixels: 200704
  min_pixels: 3136
algorithm:
  adv_estimator: grpo
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 0.01
worker:
  actor:
    global_batch_size: 4
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 1
    max_grad_norm: 1.0
    padding_free: true
    use_torch_compile: false
    model:
      model_path: /workspace/models/Qwen2.5-VL-3B-Instruct/66285546d2b821cf421d4f5eb2576359d3770cd3
      enable_gradient_checkpointing: true
      trust_remote_code: false
      freeze_vision_tower: false
    optim:
      lr: 1.0e-6
      weight_decay: 0.01
      strategy: adamw
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: true
      offload_optimizer: true
  rollout:
    n: 5
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    gpu_memory_utilization: 0.4
    enforce_eager: true
    enable_chunked_prefill: false
    tensor_parallel_size: 1
    limit_images: 1
    max_num_batched_tokens: 4096
    val_override_config:
      temperature: 0.5
      n: 1
  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: true
      enable_rank0_init: true
    offload:
      offload_params: false
  reward:
    reward_type: function
    compute_score: mcq
trainer:
  max_steps: 2
  total_episodes: 2
  logger: [console]
  project_name: praxis-original-bounded
  experiment_name: uninstrumented-001
  n_gpus_per_node: 1
  nnodes: 1
  val_before_train: true
  val_freq: 1
  val_generations_to_log: 0
  save_freq: 2
  save_limit: 1
  save_checkpoint_path: /workspace/praxis/runs/original-baseline-001/checkpoints
